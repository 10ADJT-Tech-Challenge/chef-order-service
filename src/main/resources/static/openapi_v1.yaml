openapi: 3.0.3
info:
  description: 'API para o Tech Challenge da Fase 3 - Pós Tech.


Este serviço gerencia o cadastro de usuários, tipos de usuários do sistema, restaurantes, seus cardápios e pedidos.'
  title: ChefManagerApi
  version: 3.0.0
paths:
  /restaurantes/{id}/itens-cardapio:
    get:
      operationId: buscarItensCardapioPorRestauranteId
      summary: Retorna itens de cardápio do restaurante (com filtro opcional por nome)
      tags: [ItemCardapio]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: term
          required: false
          description: Termo de busca (case-insensitive). Suporta espaços e acentos (URL-encoded).
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        '200':
          description: Itens de cardápio do restaurante retornados com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemCardapioResponse'
        '204':
          description: Nenhum item encontrado
    post:
      operationId: criarItemCardapio
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCardapioRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCardapioResponse'
          description: Itens de cardápio criado com com sucesso
      summary: Cria item de cardápio
      tags:
      - ItemCardapio
  /itens-cardapio/{id}:
    delete:
      operationId: removerItemCardapioPorId
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: Item de cardápio deletado com sucesso
      summary: Remove item de cardápio por ID
      tags:
        - ItemCardapio
    get:
      operationId: buscarItemCardapioPorId
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCardapioResponse'
          description: Item de cardápio localizado com sucesso
      summary: Consulta item por ID
      tags:
      - ItemCardapio
    put:
      operationId: atualizarItemCardapio
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemCardapioRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemCardapioResponse'
          description: Item de cardápio atualizado com sucesso
        '404':
          description: Item de cardápio não encontrado.
      summary: Atualiza item de cardápio
      tags:
      - ItemCardapio
  /itens-cardapio:
    get:
      operationId: buscarItensCardapioPorNomeGlobal
      summary: Busca itens de cardápio pelo nome
      tags:
        - ItemCardapio
      parameters:
        - in: query
          name: nome
          required: true
          description: Termo (case-insensitive) para buscar itens por nome (busca parcial)
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          description: Lista de itens retornada com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemCardapioResponse'
        '204':
          description: Nenhum item encontrado
  /restaurantes:
    get:
      operationId: buscarRestaurantePorNome
      parameters:
        - description: Nome do restaurante a ser buscado
          in: query
          name: nome
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/RestauranteResponse'
                type: array
          description: Lista retornada
        '404':
          description: Restaurante não encontrado com o nome fornecido.
      summary: Lista restaurantes
      tags:
      - Restaurante
    post:
      operationId: criarRestaurante
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestauranteRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestauranteResponse'
          description: Restaurante criado
      summary: Cadastra restaurante
      tags:
      - Restaurante
  /restaurantes/{id}:
    delete:
      operationId: deletarRestaurantePorId
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '204':
          description: Restaurante deletado com sucesso
      summary: Deleta restaurante por ID
      tags:
      - Restaurante
    get:
      operationId: buscarRestaurantePorId
      parameters:
        - in: path
          name: id
          required: true
          schema:
            format: uuid
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestauranteResponse'
          description: Restaurante encontrado
      summary: Consulta restaurante por ID
      tags:
      - Restaurante
    put:
      operationId: atualizarRestaurante
      parameters:
      - description: ID único do usuário (UUID)
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarRestauranteRequest'
        description: Dados do restaurante para atualização.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestauranteResponse'
          description: Usuário atualizado com sucesso.
        '404':
          description: Restaurante não encontrado.
      summary: Atualiza restaurante
      tags:
      - Restaurante
  /tipos-usuario:
    get:
      description: Retorna todos os tipos de usuário cadastrados.
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TipoUsuarioResponse'
                type: array
          description: Lista de tipos retornada com sucesso
      summary: Lista os tipos de usuário
      tags:
      - TipoUsuario
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipoUsuarioRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoUsuarioResponse'
          description: Tipo criado com sucesso
      summary: Cadastra novo tipo de usuário
      tags:
      - TipoUsuario
  /tipos-usuario/{id}:
    delete:
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '204':
          description: Removido com sucesso
      summary: Remove tipo de usuário
      tags:
      - TipoUsuario
    get:
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoUsuarioResponse'
          description: Tipo encontrado
      summary: Consulta tipo de usuário por ID
      tags:
      - TipoUsuario
    put:
      parameters:
      - $ref: '#/components/parameters/IdParam'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TipoUsuarioRequest'
        required: true
      responses:
        '200':
          description: Atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TipoUsuarioResponse'
      summary: Atualiza tipo de usuário
      tags:
      - TipoUsuario
  /usuarios:
    get:
      operationId: buscarPorNome
      parameters:
      - description: Nome do usuário a ser buscado
        in: query
        name: nome
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
          description: Usuário encontrado
        '404':
          description: Usuário não encontrado com o nome fornecido.
      summary: Busca um usuário por nome
      tags:
      - Usuario
    post:
      operationId: criarUsuario
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
          description: Usuário criado com sucesso
      summary: Cadastra um novo usuário
      tags:
      - Usuario
  /usuarios/{id}:
    delete:
      operationId: deletarUsuarioPorId
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '204':
          description: Usuário deletado com sucesso
      summary: Deleta usuário por ID
      tags:
      - Usuario
    get:
      operationId: buscarUsuarioPorId
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
          description: Usuário encontrado
      summary: Busca usuário por ID
      tags:
      - Usuario
    put:
      operationId: atualizar
      parameters:
      - description: ID único do usuário (UUID)
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AtualizarUsuarioRequest'
        description: Dados do usuário para atualização.
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
          description: Usuário atualizado com sucesso.
        '404':
          description: Usuário não encontrado.
      summary: Atualiza um usuário existente
      tags:
      - Usuario
  /pedidos:
    post:
      operationId: criarPedido
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PedidoRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
          description: Pedido criado com sucesso
      summary: Cadastra um novo pedido
      tags:
      - Pedido
  /pedidos/{id}:
    get:
      operationId: buscarPedidoPorId
      parameters:
      - $ref: '#/components/parameters/IdParam'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PedidoResponse'
          description: Pedido encontrado
        '404':
          description: Pedido não encontrado
      summary: Consulta pedido por ID
      tags:
      - Pedido
  /pedidos/do-usuario:
    get:
      operationId: buscarPedidosPorUsuarioId
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PedidoResponse'
          description: Lista de pedidos do usuário retornada com sucesso
        '204':
          description: Nenhum pedido encontrado para o usuário
      summary: Lista pedidos de um usuário
      tags:
      - Pedido
  /usuarios/{id}/senha:
    patch:
      operationId: alterarSenha
      parameters:
      - description: ID do usuário (UUID)
        in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarSenhaRequest'
        description: Dados para alteração de senha.
        required: true
      responses:
        '204':
          description: Senha alterada com sucesso
        '400':
          description: Dados inválidos ou senha incorreta
        '404':
          description: Usuário não encontrado
      summary: Altera a senha de um usuário específico
      tags:
      - Usuario
servers:
- description: Servidor local de desenvolvimento
  url: http://localhost:8080/api/v1
tags:
- description: Operações para gerenciar os tipos de usuário
  name: TipoUsuario
- description: CRUD de usuários
  name: Usuario
- description: CRUD de restaurantes
  name: Restaurante
- description: Gerenciamento de itens de cardápio
  name: ItemCardapio
- description: Gerenciamento de pedidos
  name: Pedido
components:
  parameters:
    IdParam:
      description: Identificador único do recurso
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ItemCardapioResponse:
      description: Item do cardápio.
      properties:
        caminhoFoto:
          type: string
        consumoLocal:
          type: boolean
        descricao:
          type: string
        id:
          type: string
          format: uuid
        restauranteId:
          type: string
          format: uuid
        nome:
          type: string
        preco:
          type: number
        dataUltimaAlteracao:
          type: string
          format: date-time
      type: object
    ItemCardapioRequest:
      properties:
        caminhoFoto:
          type: string
        consumoLocal:
          type: boolean
        descricao:
          type: string
        nome:
          type: string
        preco:
          type: number
        restauranteId:
          type: string
          format: uuid
      required:
      - nome
      - preco
      type: object
    RestauranteResponse:
      description: Dados do restaurante.
      properties:
        endereco:
          type: string
        horarioFuncionamento:
          type: string
        id:
          type: string
          format: uuid
        idDono:
          type: string
          format: uuid
        nome:
          type: string
        tipoCozinha:
          type: string
      type: object
    RestauranteRequest:
      properties:
        endereco:
          type: string
        horarioFuncionamento:
          type: string
        idDono:
          type: string
          format: uuid
        nome:
          type: string
        tipoCozinha:
          type: string
      required:
      - nome
      - endereco
      - idDono
      type: object
    AtualizarRestauranteRequest:
      properties:
        endereco:
          type: string
        horarioFuncionamento:
          type: string
        idDono:
          type: string
          format: uuid
        nome:
          type: string
        tipoCozinha:
          type: string
      required:
      - nome
      - endereco
      - idDono
      type: object
    TipoUsuarioResponse:
      description: Representa um tipo de usuário no sistema.
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        categoriaUsuario:
          type: string
      required:
        - categoriaUsuario
        - nome
      type: object
    TipoUsuarioRequest:
      properties:
        nome:
          type: string
        categoriaUsuario:
          type: string
          description: Tipo de usuário
          enum:
            - CLIENTE
            - DONO_RESTAURANTE
            - ADMIN
      required:
        - categoriaUsuario
        - nome
      type: object
    UsuarioRequest:
      type: object
      properties:
        nome:
          type: string
          example: John Doe
        email:
          type: string
          example: johndoe@example.com
        login:
          type: string
          example: johndoe
        senha:
          type: string
          example: secret123
        tipo:
          type: string
          format: uuid
        endereco:
          $ref: '#/components/schemas/EnderecoRequest'
      required:
      - nome
      - email
      - login
      - senha
      - tipo
      - endereco
    UsuarioResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nome:
          type: string
        email:
          type: string
        login:
          type: string
        tipo:
          type: object
          properties:
            id:
              type: string
              format: uuid
            nome:
              type: string
            categoriaUsuario:
              type: string
        endereco:
          $ref: '#/components/schemas/EnderecoResponse'
        dataUltimaAlteracao:
          type: string
          format: date-time
      required:
      - id
      - nome
      - email
      - login
      - tipo
      - endereco
      - dataUltimaAlteracao
    EnderecoRequest:
      type: object
      properties:
        rua:
          type: string
          example: Rua das Flores
        numero:
          type: string
          example: 123
        cidade:
          type: string
          example: Barbacena
        cep:
          type: string
          example: 36200-000
        uf:
          type: string
          example: MG
      required:
      - rua
      - numero
      - cidade
      - cep
      - uf
    EnderecoResponse:
      type: object
      properties:
        rua:
          type: string
          example: Rua das Flores
        numero:
          type: string
          example: 123
        cidade:
          type: string
          example: Barbacena
        cep:
          type: string
          example: 36200-000
        uf:
          type: string
          example: MG
    AlterarSenhaRequest:
      type: object
      properties:
        senhaAtual:
          type: string
          example: secret123
        novaSenha:
          type: string
          example: novaSenha456
      required:
      - senhaAtual
      - novaSenha
    PedidoRequest:
      type: object
      properties:
        restauranteId:
          type: string
          format: uuid
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemPedidoRequest'
          minItems: 1
      required:
      - restauranteId
      - itens
    ItemPedidoRequest:
      type: object
      properties:
        itemCardapioId:
          type: string
          format: uuid
        descricao:
          type: string
        preco:
          type: number
        quantidade:
          type: integer
          minimum: 1
      required:
      - itemCardapioId
      - descricao
      - preco
      - quantidade
    PedidoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        restauranteId:
          type: string
          format: uuid
        dataPedido:
          type: string
          format: date-time
        itens:
          type: array
          items:
            $ref: '#/components/schemas/ItemPedidoResponse'
      required:
      - id
      - restauranteId
      - dataPedido
      - itens
    ItemPedidoResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        itemCardapioId:
          type: string
          format: uuid
        pedidoId:
          type: string
          format: uuid
        descricao:
          type: string
        preco:
          type: number
        quantidade:
          type: integer
      required:
      - id
      - pedidoId
      - descricao
      - preco
      - quantidade
    AtualizarUsuarioRequest:
      type: object
      properties:
        nome:
          type: string
        email:
          type: string
          format: email
        login:
          type: string
        tipo:
          type: string
          format: uuid
        endereco:
          $ref: '#/components/schemas/EnderecoRequest'